<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDEplug Decrypter</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      .container {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      h1 {
        margin-top: 0;
      }

      .card {
        background: #1f2937;
        border-radius: 12px;
        padding: 20px;
      }

      .row {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }

      label {
        font-size: 14px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 10px 12px;
        background: #111827;
        color: #f9fafb;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }

      #status {
        margin-top: 16px;
        min-height: 22px;
        color: #93c5fd;
      }

      .hint {
        color: #9ca3af;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>DDEplug Decrypter</h1>
      <p class="hint">Starter GUI for decrypting codeplug files with a native C backend.</p>
      <section class="card">
        <form id="decrypt-form">
          <div class="row">
            <label for="inputPath">Encrypted file path</label>
            <input id="inputPath" name="inputPath" placeholder="/path/to/input.bin" required />
          </div>
          <div class="row">
            <label for="outputPath">Output file path</label>
            <input id="outputPath" name="outputPath" placeholder="/path/to/output.bin" required />
          </div>
          <button type="submit">Decrypt</button>
        </form>
        <p id="status"></p>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
